name: Automated PR Review (Vertex AI)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/**'
      - '.claude/skills/**'
      - '*.md'
      - 'LICENSE'

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write  # Workload Identity Federation用

jobs:
  automated-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run Claude Code PR Review via Vertex AI
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          CLOUD_ML_REGION: global
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_vertex: "true"
          prompt: |
            このPull Requestを包括的にレビューしてください。

            **PR情報**:
            - リポジトリ: ${{ github.repository }}
            - PR番号: ${{ github.event.pull_request.number }}
            - ブランチ: ${{ github.event.pull_request.head.ref }}
            - ベースブランチ: ${{ github.event.pull_request.base.ref }}
            - 作成者: ${{ github.event.pull_request.user.login }}

            ## レビューワークフロー

            ### ステップ1: PR情報の取得

            まず、`gh`コマンドを使用してPR情報を取得してください：

            ```bash
            # PR基本情報の取得
            gh pr view ${{ github.event.pull_request.number }} --json title,body,author,createdAt,headRefName,baseRefName,mergeable,reviewDecision

            # 変更ファイル一覧の取得
            gh pr diff ${{ github.event.pull_request.number }} --name-only

            # コード差分の取得
            gh pr diff ${{ github.event.pull_request.number }}

            # 既存のレビューとコメントの確認
            gh pr view ${{ github.event.pull_request.number }} --json reviews,comments
            ```

            ### ステップ2: コード分析

            以下の観点から包括的にコードを分析してください：

            #### 🔧 コード品質 (Code Quality)

            - **可読性**
              - 命名規則: 変数名、関数名、クラス名が明確で理解しやすいか
              - コメント: 複雑なロジックに適切なコメントがあるか
              - コードの構造: 適切にモジュール化され、責務が分離されているか

            - **保守性**
              - DRY原則: コードの重複がないか
              - 複雑度: 関数やメソッドが複雑すぎないか（循環的複雑度）
              - 依存関係: 適切な結合度が保たれているか

            - **設計パターン**
              - デザインパターン: 適切なデザインパターンが使用されているか
              - SOLID原則: オブジェクト指向設計の原則が守られているか
              - アーキテクチャ: プロジェクトのアーキテクチャパターンに準拠しているか

            - **ベストプラクティス**
              - 言語固有: 使用言語のイディオムやベストプラクティスに従っているか
              - フレームワーク: 使用フレームワークの推奨パターンに従っているか
              - コーディング規約: プロジェクトのコーディング規約に準拠しているか

            #### 🔒 セキュリティ (Security)

            - **OWASP Top 10**
              - インジェクション: SQLインジェクション、コマンドインジェクションの脆弱性
              - 認証の不備: 不適切な認証実装、セッション管理の問題
              - データ露出: 機密データの不適切な公開
              - XXE: XMLの外部エンティティ処理の脆弱性
              - アクセス制御: 不適切な認可処理
              - セキュリティ設定ミス: デフォルト設定の使用、不要な機能の有効化
              - XSS: クロスサイトスクリプティングの脆弱性
              - 安全でないデシリアライゼーション
              - 脆弱な依存関係: 既知の脆弱性を持つライブラリの使用
              - ログとモニタリング: 不十分なログ記録

            - **認証・認可**
              - 認証フロー: ログイン、ログアウトの適切な実装
              - トークン管理: JWTなどのトークンの安全な取り扱い
              - パスワード: 適切なハッシュ化、保存方法
              - 多要素認証: 適切なMFA実装（該当する場合）

            - **入力検証とサニタイゼーション**
              - ユーザー入力: すべてのユーザー入力が検証されているか
              - サニタイゼーション: XSS対策のための適切なエスケープ
              - ホワイトリスト: 許可リストによる検証アプローチ

            - **機密情報**
              - ハードコードされたシークレット: APIキー、パスワードの埋め込み
              - 環境変数: 機密情報の適切な管理
              - ログ出力: ログに機密情報が含まれていないか

            - **暗号化**
              - データの暗号化: 通信時および保存時の暗号化
              - 暗号アルゴリズム: 安全なアルゴリズムの使用
              - 鍵管理: 暗号鍵の適切な管理

            #### 🧪 テスト (Testing)

            - **テストカバレッジ**
              - ユニットテスト: 新しい関数やメソッドに対するテスト
              - 統合テスト: コンポーネント間の統合に対するテスト
              - E2Eテスト: エンドツーエンドのユーザーフローテスト

            - **テストケースの妥当性**
              - 正常系: 期待される動作のテスト
              - 異常系: エラーケースのテスト
              - エッジケース: 境界値、極端な入力のテスト
              - テストデータ: 適切なテストデータの使用

            - **テストの品質**
              - テストの独立性: 各テストが独立して実行可能か
              - テストの保守性: テストコードが理解しやすく保守しやすいか
              - モック/スタブ: 適切なモックやスタブの使用
              - アサーション: 明確で適切なアサーション

            #### ⚡ パフォーマンス (Performance)

            - **アルゴリズムの効率性**
              - 時間計算量: O(n)、O(n²)などの計算量の評価
              - 空間計算量: メモリ使用量の評価
              - 最適化: より効率的なアルゴリズムの提案

            - **リソース使用**
              - メモリリーク: 不要なオブジェクトの保持
              - CPU使用: 不必要な計算の削減
              - I/O: 効率的なファイル操作、ネットワーク通信

            - **データベース**
              - クエリ最適化: インデックスの使用、効率的なクエリ
              - N+1問題: 繰り返しクエリの検出
              - トランザクション: 適切なトランザクション管理
              - コネクションプール: データベース接続の効率的な管理

            - **スケーラビリティ**
              - 大規模データ: 大量のデータ処理への対応
              - 高負荷: 同時リクエストへの対応
              - キャッシング: 適切なキャッシュ戦略

            ### ステップ3: 問題の分類

            検出された問題を以下のカテゴリーに分類してください：

            | 重要度 | 説明 | スコア影響 | アクション |
            |--------|------|------------|------------|
            | **Critical** | 即座にシステムに不具合を起こす問題。マージ前に必ず修正が必要 | -3点 | REQUEST_CHANGES |
            | **Major** | セキュリティリスクや重大なバグの可能性。優先的に修正すべき | -2点 | Issue起票 (high) |
            | **Minor** | 改善の余地があるがすぐには影響しない問題 | -1点 | Issue起票 (medium) |
            | **Suggestion** | ベストプラクティスや最適化の提案 | -0.5点 | Issue起票 (low) |

            **スコアリング**: 各カテゴリーを10点満点で評価し、検出された問題の重要度に応じて減点してください。

            ### ステップ4: レビュー結果の投稿

            分析結果に基づいて、`gh`コマンドを使用してレビューを投稿してください：

            #### パターン1: Critical問題がある場合

            ```bash
            gh pr review ${{ github.event.pull_request.number }} \
              --request-changes \
              --body "## ⚠️ 変更が必要です

            以下のCritical問題が検出されました。修正してから再度レビューをリクエストしてください。

            ### Critical問題

            [検出された問題の詳細リスト]

            修正後、このレビューを解決してください。"
            ```

            #### パターン2: Major/Minor問題がある場合

            1. **条件付きApproveを実施**：

            ```bash
            gh pr review ${{ github.event.pull_request.number }} \
              --approve \
              --body "## ✅ 条件付きでApprove

            コードレビューを完了しました。重大な問題は見つかりませんでしたが、いくつかの改善点があります。

            ### 分析結果

            #### Code Quality: X/10
            [詳細]

            #### Security: X/10
            [詳細]

            #### Testing: X/10
            [詳細]

            #### Performance: X/10
            [詳細]

            ### 改善項目

            改善点をIssueとして起票しました。ご確認ください：
            - Issue #XXX
            - Issue #YYY

            これらは次のイテレーションで対応することをお勧めします。"
            ```

            2. **各問題をIssueとして起票**：

            各Major/Minor問題に対して、以下の形式でIssueを作成してください：

            ```bash
            gh issue create \
              --title "🔒 [MAJOR] 入力検証が不十分 (src/api/handler.ts)" \
              --body "## 概要
            PR #${{ github.event.pull_request.number }} のレビューで検出されたセキュリティ上の改善点です。

            **関連PR**: #${{ github.event.pull_request.number }}

            ## 詳細
            **カテゴリー**: security
            **重要度**: major
            **ファイル**: \`src/api/handler.ts\`

            ### 問題
            ユーザー入力の検証が不十分で、インジェクション攻撃のリスクがあります。

            ### 推奨される対応
            1. すべてのユーザー入力に対してバリデーションを追加
            2. ホワイトリスト方式での検証を実装
            3. サニタイゼーション処理を追加

            ## チェックリスト
            - [ ] 問題を確認
            - [ ] 修正を実装
            - [ ] テストを追加/更新
            - [ ] セキュリティレビューを実施" \
              --assignee "${{ github.event.pull_request.user.login }}" \
              --label "priority:high,security"
            ```

            **絵文字の対応**:
            - 🔧 code-quality
            - 🔒 security
            - 🧪 testing
            - ⚡ performance

            **重要度の表記**:
            - `[CRITICAL]`: 致命的な問題
            - `[MAJOR]`: 重要な問題
            - `[MINOR]`: 軽微な問題
            - `[SUGGESTION]`: 提案

            #### パターン3: 問題がない場合

            ```bash
            gh pr review ${{ github.event.pull_request.number }} \
              --approve \
              --body "## ✅ Approved

            コードレビューを完了しました。問題は見つかりませんでした。

            ### 分析結果

            #### Code Quality: 10/10
            ✅ すべての基準を満たしています

            #### Security: 10/10
            ✅ セキュリティ上の問題は検出されませんでした

            #### Testing: 10/10
            ✅ 適切なテストカバレッジがあります

            #### Performance: 10/10
            ✅ パフォーマンス上の問題は見つかりませんでした

            ### Summary

            素晴らしいコードです！マージして問題ありません。"
            ```

            ### ステップ5: 除外パターン

            以下のファイルや変更は自動レビューから除外してください：

            - ロックファイル: `package-lock.json`, `yarn.lock`, `Gemfile.lock`, `poetry.lock`, `Cargo.lock`
            - 依存関係ディレクトリ: `node_modules/`, `vendor/`, `target/`, `build/`, `dist/`
            - 自動生成ファイル: `*.generated.*`, `*.auto.*`, `*_pb2.py`, `*.g.dart`
            - バイナリファイル: 画像、動画、フォント、実行ファイル
            - 大規模データファイル: 1000行以上のJSON、CSV、XMLなど
            - 設定ファイル: `.env.example`, `docker-compose.yml`（変更が小規模な場合）

            ## 重要な注意事項

            - レビューはAIによる自動分析であり、最終的な判断は人間のレビュアーが行う必要があります
            - 言語やフレームワーク固有の高度な分析には限界があります
            - 複雑なビジネスロジックやドメイン知識が必要な判断は人間のレビューが必要です
            - PRが大きすぎる場合（500ファイル以上、10,000行以上の変更）は、主要な変更箇所に焦点を当ててください
          claude_args: |
            --model claude-sonnet-4-5@20250929
            --max-turns 10
            --timeout 600
