# xtone-auth-plugin CI。T-014 品質ゲートルール対応（R-013 Lint / R-006 スキーマ検証 / R-015 リリースノート）。
# 方針: warn_and_document（T-002）— 検証は通すが、人間判断が要る箇所はブロックせず警告に留める。
# 注: run: では github.event.* 等の未信頼入力を一切展開しない（インジェクション対策）。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin (Claude Code)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict . || echo "::warning::plugin validate に警告があります（warn_and_document, T-002）"
          else
            echo "::warning::claude CLI 未導入のため plugin validate をスキップ"
          fi

      - name: Validate sample-outputs against schemas (R-006)
        run: |
          # スキーマ検証スクリプト(scripts/validate-plugin.sh, TPL-27)整備後に置換する。
          # 現状は sample-outputs/*.json が JSON として妥当かを確認する最小チェック。
          for f in sample-outputs/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              && echo "ok: $f" \
              || echo "::warning::$f が不正な JSON です"
          done

      - name: Lint shell hooks (R-013)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck hooks/*.sh || echo "::warning::shellcheck に警告があります（warn_and_document）"
          else
            echo "::warning::shellcheck 未導入のためスキップ"
          fi
